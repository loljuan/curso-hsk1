<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Curso HSK 1</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HSK 1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19201d" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Source+Sans+3:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.HSK_PWA = true;</script>
</head>
<body>
<style>
/* Layout: cuaderno de caligrafía — barra superior fija, columna central de lectura, cuadrículas 田字格 para los caracteres */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e9ede8; --ink:#1b2320; --muted:#5a6762; --line:#d8dfda;
  --accent:#1d6b58; --accent-ink:#ffffff; --accent-soft:#dcece5;
  --good:#2e7d32; --good-soft:#e2f1e3; --bad:#b3261e; --bad-soft:#f8e1df;
  --t1:#c93a3a; --t2:#c27a0e; --t3:#2468b8; --t4:#7d43b8; --t5:#7a8580;
  --grid:#e4b7b0;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-han:"Noto Serif SC","Songti SC","SimSun","Noto Serif CJK SC",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201d; --sunk:#222b27; --ink:#e6ece8; --muted:#9aa8a1; --line:#2d3833;
  --accent:#5cc0a0; --accent-ink:#0d1a15; --accent-soft:#1d3229;
  --good:#7bcf80; --good-soft:#1c2e1d; --bad:#f08a80; --bad-soft:#3a1e1c;
  --t1:#ff7a7a; --t2:#f0b04a; --t3:#6fa8ff; --t4:#c79bff; --t5:#97a29d; --grid:#5a3a36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201d; --sunk:#222b27; --ink:#e6ece8; --muted:#9aa8a1; --line:#2d3833;
  --accent:#5cc0a0; --accent-ink:#0d1a15; --accent-soft:#1d3229;
  --good:#7bcf80; --good-soft:#1c2e1d; --bad:#f08a80; --bad-soft:#3a1e1c;
  --t1:#ff7a7a; --t2:#f0b04a; --t3:#6fa8ff; --t4:#c79bff; --t5:#97a29d; --grid:#5a3a36; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.han{font-family:var(--f-han)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra superior */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand .seal{width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-han);font-size:20px;font-weight:600}
.brand b{font-family:var(--f-display);font-size:1.05rem}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;font-size:.95rem}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a.on{background:var(--accent-soft);color:var(--accent)}
main{padding-block:28px 64px}

/* Tonos */
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.py{font-weight:600;letter-spacing:.01em}

/* Elementos comunes */
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.say{border:none;background:var(--accent-soft);color:var(--accent);width:30px;height:30px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;flex-shrink:0;padding:0}
.say svg{width:16px;height:16px}
.say:hover{background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);font-size:.8rem;font-weight:600}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.notice{padding:12px 16px;border-radius:9px;background:var(--accent-soft);color:var(--ink);font-size:.95rem}
input[type=search],select{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=search]{flex:1;min-width:180px}
.hz{cursor:pointer;border-radius:3px}
.hz:hover{background:var(--accent-soft);color:var(--accent)}

/* Inicio */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center;margin-bottom:36px}
.hero h1{font-size:2.6rem}
.hero .lead{font-size:1.12rem;color:var(--muted);max-width:56ch;margin-top:12px}
.hero .big{font-family:var(--f-han);font-size:7rem;line-height:1;text-align:center;position:relative}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0 8px}
.typerow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.typerow input{font:inherit;font-size:1.25rem;padding:10px 14px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:min(320px,100%);text-align:center;letter-spacing:.03em}
.typerow input:focus{border-color:var(--accent);outline:none}
.typerow input.ok{border-color:var(--good);background:var(--good-soft)}
.typerow input.ko{border-color:var(--bad);background:var(--bad-soft)}
.emo{font-size:2.6rem;line-height:1.2;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pic{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 10px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:84px}
.pic .lt{position:absolute;top:6px;left:9px;font-weight:700;color:var(--accent);font-size:.9rem}
.pic .han{font-size:1.3rem}
.grp{display:flex;flex-direction:column;gap:8px}
.gi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.gi.ok{border-color:var(--good);background:var(--good-soft)}
.gi.ko{border-color:var(--bad);background:var(--bad-soft)}
.gi .gq{min-width:0}
.gi .gq .han{font-size:1.25rem}
.gi .fbx{grid-column:1/-1;font-size:.92rem}
.opt .emo{font-size:2.4rem}
.partbar{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.partbar .zhp{font-family:var(--f-han);font-weight:600;color:var(--accent)}
.mara{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px}
.mara i{display:block;height:8px;border-radius:2px;background:var(--sunk)}
.mara i.on{background:var(--accent)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:1.6rem;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.syllabus{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lcard{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.lcard:hover{border-color:var(--accent)}
.lcard .num{width:52px;height:52px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--muted)}
.lcard.done .num{background:var(--accent);color:var(--accent-ink)}
.lcard h3{font-size:1rem}
.lcard .zh{font-family:var(--f-han);color:var(--muted);font-size:.95rem}
.lcard .st{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.section-h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:34px 0 14px;flex-wrap:wrap}

/* Lección */
.lesson-head{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.lesson-head .zh{font-family:var(--f-han);font-size:1.5rem;color:var(--accent)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.lesson-body{display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson-body > p{max-width:68ch}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:12px}
.vocab{display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow:auto}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.vrow:hover{background:var(--sunk)}
.vrow .h{font-family:var(--f-han);font-size:1.25rem}
.vrow .m{font-size:.85rem;color:var(--muted);line-height:1.3}
.gbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.gbox .gt{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.gbox .gt::before{content:"语法";font-family:var(--f-han);font-size:.78rem;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;flex-shrink:0}
.gbox .gx{padding:14px 18px;color:var(--ink)}
.exlist{display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 18px;border-top:1px solid var(--line)}
.ex:first-child{border-top:none}
.ex .zh{font-family:var(--f-han);font-size:1.3rem;line-height:1.4}
.ex .pp{font-size:.95rem}
.ex .es{color:var(--muted);font-size:.93rem}
.tip{padding:14px 18px;border-radius:var(--r);background:var(--accent-soft);max-width:72ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:none}
td .han,td{font-variant-numeric:tabular-nums}
.dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px 0}
.dialog .dh{padding:8px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dl{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:9px 18px;align-items:start}
.dl .who{font-weight:700;color:var(--accent);font-size:.9rem;padding-top:4px}
.dl .zh{font-family:var(--f-han);font-size:1.25rem}
.hide-py .pp{display:none}
.hide-es .es{display:none}
.tones{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tone{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tone:hover{border-color:var(--accent)}
.tone svg{width:64px;height:44px}
.tone .s{font-size:1.5rem;font-weight:700}
.tone .c{font-family:var(--f-han);font-size:1.2rem}
.pygrid{display:flex;flex-wrap:wrap;gap:6px}
.pygrid span{padding:4px 10px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.radgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rad{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px}
.rad .r{font-family:var(--f-han);font-size:2rem;line-height:1.1;color:var(--accent)}
.rad .e{font-family:var(--f-han);font-size:1.15rem;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}

/* Quiz */
.q{display:flex;flex-direction:column;gap:12px}
.q .prompt{font-size:1.1rem;font-weight:600}
.q .prompt .han{font-size:1.4rem}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1rem}
.opt.han{font-size:1.25rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.ko{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{padding:10px 14px;border-radius:9px;font-size:.95rem}
.fb.ok{background:var(--good-soft)}
.fb.ko{background:var(--bad-soft)}
.score{font-family:var(--f-display);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}

/* Caracteres */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 18px;align-items:center}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ccard{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 8px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.ccard:hover{border-color:var(--accent)}
.ccard .g{font-family:var(--f-han);font-size:2.6rem;line-height:1.2}
.ccard .p{font-weight:600;font-size:.95rem}
.ccard .m{font-size:.78rem;color:var(--muted);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .n{position:absolute;top:6px;left:8px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ccard.known::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* Palabras */
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.wcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.wcard:hover{border-color:var(--accent)}
.wcard .h{font-family:var(--f-han);font-size:1.6rem;line-height:1.2}
.wcard .m{font-size:.86rem;color:var(--muted);line-height:1.3}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,13,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.mbox{background:var(--bg);border-radius:14px;width:100%;max-width:760px;border:1px solid var(--line);position:relative}
.mclose{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1}
.mhead{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:24px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:14px 14px 0 0}
.tzg{position:relative;width:220px;height:220px;max-width:100%;border:2px solid var(--grid);background:var(--surface);border-radius:4px}
.tzg svg.grid{position:absolute;inset:0;width:100%;height:100%}
.tzg .hw{position:relative;width:100%;height:100%}
.mhead .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.mhead .bigpy{font-size:2rem;font-weight:700}
.mhead .mean{font-size:1.2rem}
.facts{display:grid;grid-template-columns:repeat(3,auto);gap:4px 18px;font-size:.9rem;justify-content:start}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.mbody{padding:20px 24px 26px;display:flex;flex-direction:column;gap:22px}
.uses{display:flex;flex-direction:column;gap:6px}
.use{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto;gap:12px;align-items:center;padding:8px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.use .h{font-family:var(--f-han);font-size:1.35rem}
.use .h b{color:var(--accent);font-weight:600}
.use .d{font-size:.92rem;min-width:0}
.breakdown{display:flex;gap:10px;flex-wrap:wrap}
.bk{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px;text-align:center;cursor:pointer;min-width:90px}
.bk:hover{border-color:var(--accent)}
.bk .g{font-family:var(--f-han);font-size:2.2rem;line-height:1.2}

/* Tarjetas */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.fc{width:100%;max-width:440px;min-height:300px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;cursor:pointer;text-align:center}
.fc .front{font-family:var(--f-han);font-size:5rem;line-height:1.1}
.fc .front.es{font-family:var(--f-body);font-size:1.6rem;font-weight:600}
.fc .back{display:flex;flex-direction:column;gap:6px;align-items:center}
.boxes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.boxes span{font-size:.8rem;padding:3px 9px;border-radius:99px;background:var(--sunk);font-variant-numeric:tabular-nums}

/* Ejercicios */
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.cfg label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}
.cfg label small{display:block;color:var(--muted);font-size:.82rem;line-height:1.3}
.cfg input{margin-top:4px;accent-color:var(--accent)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1px dashed var(--line);border-radius:9px}
.tok{font-family:var(--f-han);font-size:1.3rem;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tok:hover{border-color:var(--accent)}
.bigq{font-family:var(--f-han);font-size:3.4rem;line-height:1.2;text-align:center;padding:8px 0}
.writebox{display:flex;justify-content:center}
.review{display:flex;flex-direction:column;gap:6px}

@media (max-width:860px){
  .lesson{grid-template-columns:minmax(0,1fr)}
  .aside{position:static}
  .hero{grid-template-columns:1fr}
  .hero .big{display:none}
  .syllabus{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .gi{grid-template-columns:auto 1fr}
  .gi select{grid-column:1/-1}
}
@media (max-width:560px){
  h1,.hero h1{font-size:1.9rem}
  .brand b{display:none}
  .opts{grid-template-columns:1fr}
  .tones{grid-template-columns:repeat(3,1fr)}
  .mhead{grid-template-columns:1fr;justify-items:center;text-align:center}
  .mhead .info{align-items:center}
  .facts{justify-content:center}
  .dl{grid-template-columns:1fr auto}
  .dl .who{grid-column:1/-1;padding:0}
  .use{grid-template-columns:auto 1fr}
  .use .say{grid-column:2;justify-self:end}
}
/* Táctil e iPhone */
nav.tabs a svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a,button,.ccard,.wcard,.vrow,.use,.bk,.tok,.opt,.fc{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;resize:vertical}
#synccode{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
input[type=search],select{font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(560px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.18)}
@media (max-width:700px){
  header.top .wrap{padding-block:10px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(7,1fr);gap:0;overflow:visible;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(4px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px))}
  nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:.62rem;letter-spacing:0;border-radius:10px;min-width:0}
  nav.tabs a svg{display:block}
  nav.tabs a.on{background:none;color:var(--accent)}
  nav.tabs a.on svg{stroke-width:2.3}
  .brand b{display:inline!important}
  main{padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .modal{padding:0;background:var(--bg)}
  .mbox{border-radius:0;border:none;min-height:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .mhead{border-radius:0;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  .mclose{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:2;width:40px;height:40px}
  .btn{padding:11px 16px}
  .say{width:36px;height:36px}
  .opt{padding:14px}
  .lesson-nav .btn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
